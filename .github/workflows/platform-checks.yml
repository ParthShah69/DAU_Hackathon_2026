name: CarbonBridge platform checks

on:
  push:
    paths:
      - 'contracts/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/platform-checks.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - 'data/**'
      - 'scripts/**'
      - 'tests/**'
      - 'apps/api/**'
      - 'apps/web/**'
      - 'package.json'
      - '.github/workflows/platform-checks.yml'

permissions:
  contents: read

jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check:all

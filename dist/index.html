<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10271e" />
    <meta name="description" content="CarbonBridge process-first circular carbon marketplace" />
    <title>CarbonBridge | Turn process into possibility</title>
    <link rel="stylesheet" href="/src/styles.css" />

  <body>
    <div id="root"></div>
    <script>
      // The local preview proxies the prototype API. The public static Site has
      // no API runtime, so it must stay in its self-contained demo mode.
      const carbonbridgeLocalHost = ['localhost', '127.0.0.1'].includes(window.location.hostname)
      window.__CARBONBRIDGE_CONFIG__ = window.__CARBONBRIDGE_CONFIG__ || (carbonbridgeLocalHost ? { apiBaseUrl: '/api/v1' } : { mode: 'demo' })
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
